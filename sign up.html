<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up</title>

<style>
body {
  font-family: Arial;
  background: linear-gradient(135deg,#f5f1f3,#efebf1,#f3f7fa);
  display:flex; justify-content:center; align-items:center;
  height:100vh; margin:0;
}
.box {
  background:white;
  padding:25px;
  border-radius:10px;
  width:300px;
  text-align:center;
}
input, button {
  width:100%; padding:10px; margin:10px 0;
}
button {
  background:#ff4da6; color:white; border:none;
}
</style>
</head>

<body>

<div class="box">
  <h2>Create Account</h2>

  <input type="text" id="newUser" placeholder="Username">
  <input type="password" id="newPass" placeholder="Password">

  <button onclick="signup()">Sign Up</button>

  <p id="msg"></p>
</div>

<script>
function signup() {
  let user = document.getElementById("newUser").value;
  let pass = document.getElementById("newPass").value;
  let msg = document.getElementById("msg");

  if (!user || !pass) {
    msg.innerHTML = "❌ Fill all fields";
    return;
  }

  // SAVE ACCOUNT
  localStorage.setItem("username", user);
  localStorage.setItem("password", pass);

  msg.innerHTML = "✅ Account created";

  // REDIRECT TO LOGIN
  setTimeout(() => {
    window.location.href = "login.html";
  }, 1000);
}
</script>

</body>
</html>
