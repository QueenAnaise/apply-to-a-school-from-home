<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact - E-Saba</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: white /* 👉 papo */
}

/* CONTACT */
.contact {
  background: linear-gradient(to right, pink, purple);
  color: white;
  padding: 40px;
  text-align: center;
  margin: 50px auto;
  width: 350px;
  border-radius: 10px;
  box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}

.contact h2 {
  margin-bottom: 15px;
}
.social a {
  font-size: 25px;
  margin: 10px;
  color: white;
  background: rgb(0, 98, 128);
  padding: 10px;
  border-radius: 50%;
  display: inline-block;
  transition: 0.3s;
}

.social a:hover {
  background: pink;
  color: black;
}

</style>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>

<div class="contact">
  <h2>Contact Us</h2>

  <p>📞 Phone: <b>0724666333</b></p>
  <p>📍 Location: Rwamagana</p>

  <h3>Follow Us</h3>

  <div class="social">
  <a href="https://facebook.com" target="_blank">
    <i class="fab fa-facebook"></i>
  </a>

  <a href="https://instagram.com" target="_blank">
    <i class="fab fa-instagram"></i>
  </a>

  <a href="mailto:example@gmail.com">
    <i class="fas fa-envelope"></i>
  </a>
</div>
</div>

</body>
</html>
